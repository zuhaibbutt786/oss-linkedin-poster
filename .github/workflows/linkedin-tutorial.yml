name: Weekly AI/ML PDF Tutorial

on:
  schedule:
    # Daily at 06:00 UTC = 11:00 AM PKT — script posts ~once/week on a random day
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tutorial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab

      - name: Post PDF tutorial (if due)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_TUTORIAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/tutorial_post.py

      - name: Save tutorial state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tutorial_state.json
          git diff --staged --quiet || git commit -m "Record tutorial post [skip ci]"
          git push
